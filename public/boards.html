<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<title>o!hana — Custom Leaderboards</title>
		<meta
			name="description"
			content="Create custom leaderboards and add player names."
		/>
		<link rel="stylesheet" href="styles.css" />
		<link rel="stylesheet" href="boards.css" />
	</head>
	<body class="boards-body">
		<main class="boards-shell">
			<header class="boards-top">
				<a class="link" href="index.html">← Beatmap leaderboard</a>
				<h1>Custom Leaderboards</h1>
			</header>

			<p class="boards-warning" role="status">
				<svg
					xmlns="http://www.w3.org/2000/svg"
					width="17"
					height="17"
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round"
				>
					<path
						d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
					/>
					<line x1="12" y1="9" x2="12" y2="13" />
					<line x1="12" y1="17" x2="12.01" y2="17" />
				</svg>
				<strong>Notice</strong>
				— Make Sure to Keep Your Leaderboards Relatively Small (<30 People) or Peppy Will Come to Your House.
			</p>

			<div class="boards-layout">
				<aside class="boards-side">
					<form class="side-form" id="new-board-form">
						<input
							id="new-board-name"
							type="text"
							maxlength="48"
							placeholder="New leaderboard name"
							autocomplete="off"
							required
						/>
						<button type="submit">Create</button>
					</form>
					<p class="form-error" id="new-board-error" hidden></p>
					<ul class="board-list" id="board-list"></ul>
				</aside>

				<section class="board-panel">
					<div class="panel-heading">
						<div>
							<h2 id="board-title">No leaderboard selected</h2>
							<p id="board-subtitle">Create one on the left to get started</p>
						</div>
						<button
							type="button"
							class="ghost danger"
							id="delete-board"
							hidden
						>
							Delete board
						</button>
					</div>

					<form class="player-form" id="add-player-form" hidden>
						<input
							id="player-name"
							type="text"
							maxlength="32"
							placeholder="Player name"
							autocomplete="off"
							required
						/>
						<button type="submit">Add player</button>
					</form>
					<p class="form-error" id="player-error" hidden></p>

					<ol class="player-list" id="player-list"></ol>
				</section>
			</div>
		</main>

		<script src="brdmain.js" type="module"></script>
	</body>
</html>
